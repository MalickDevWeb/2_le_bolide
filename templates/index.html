<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Bolide - IoT Telemetry Radar</title>
    <!-- Google Fonts: Space Grotesk -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Tailwind CSS (for layout simplicity) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #030712;
            --surface: rgba(17, 24, 39, 0.7);
            --neon-cyan: #00f0ff;
            --neon-red: #ff003c;
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.1) 0%, transparent 50%),
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            color: var(--text-main);
        }
        header {
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            background: linear-gradient(180deg, rgba(0, 240, 255, 0.05) 0%, transparent 100%);
        }
        .logo {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
        .live-dot {
            width: 10px; height: 10px;
            background: var(--neon-red);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--neon-red);
            animation: blink 1s infinite alternate;
        }
        @keyframes blink { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0.3; transform: scale(1.2); } }
        
        .status-badge {
            background: rgba(0, 240, 255, 0.1);
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .panel {
            background: var(--surface);
            border: 1px solid rgba(0, 240, 255, 0.15);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }
        .panel::before, .panel::after {
            content: ''; position: absolute;
            width: 20px; height: 2px; background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
        }
        .panel::before { top: 0; left: 0; }
        .panel::after { bottom: 0; right: 0; }

        .metric-value {
            text-shadow: 0 0 20px rgba(255,255,255,0.4);
            font-variant-numeric: tabular-nums;
            transition: color 0.1s;
        }
        .flash { color: var(--neon-cyan) !important; text-shadow: 0 0 30px var(--neon-cyan) !important; }

        .terminal {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(0, 240, 255, 0.1);
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">
    <!-- Header -->
    <header class="flex justify-between items-center px-10 py-5">
        <div class="logo text-2xl font-bold uppercase tracking-widest flex items-center gap-3">
            <div class="live-dot"></div> LE BOLIDE // TÉLÉMÉTRIE
        </div>
        <div class="status-badge px-6 py-2 rounded font-semibold text-sm tracking-wider flex items-center gap-2" id="conn-status">
            <i class="ph ph-spinner-gap animate-spin text-lg"></i> Initialisation WebSocket...
        </div>
    </header>

    <!-- Main Grid -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-[350px_1fr] gap-8 p-10">
        <!-- Left Panel -->
        <div class="panel rounded-lg p-8 flex flex-col">
            <div class="mb-10">
                <div class="text-neon-cyan text-sm uppercase tracking-widest mb-2 flex items-center gap-2">
                    <i class="ph ph-thermometer text-xl"></i> Température Sonde A1
                </div>
                <div class="metric-value text-white text-6xl font-bold leading-none" id="current-temp">--<span class="text-3xl text-slate-500">°C</span></div>
            </div>
            
            <div class="mb-10">
                <div class="text-neon-cyan text-sm uppercase tracking-widest mb-2 flex items-center gap-2">
                    <i class="ph ph-activity text-xl"></i> Fréquence (Hz)
                </div>
                <div class="text-white text-4xl font-bold leading-none">2.0<span class="text-xl text-slate-500">Hz</span></div>
                <p class="text-slate-500 text-sm mt-4 leading-relaxed">
                    Pipeline Asynchrone : <span class="text-[#00f0ff]">FastAPI + uvloop</span><br>
                    Protocole : <span class="text-[#00f0ff]">WebSocket WSS</span>
                </p>
            </div>

            <!-- Fake Terminal -->
            <div class="terminal mt-auto h-40 rounded p-4 text-xs overflow-y-auto text-slate-500" id="terminal-logs">
                <div class="mb-1">Système de télémétrie prêt. En attente de données...</div>
            </div>
        </div>
        
        <!-- Right Panel Chart -->
        <div class="panel rounded-lg p-8 flex flex-col">
            <div class="flex justify-between items-center mb-6 text-slate-500 text-sm uppercase tracking-wider">
                <span>Flux de données temps réel (Pydantic Validated)</span>
                <span class="text-[#00f0ff] flex items-center gap-2"><i class="ph ph-broadcast"></i> CONNECTÉ</span>
            </div>
            <div class="flex-1 relative w-full h-full">
                <canvas id="iotChart"></canvas>
            </div>
        </div>
    </main>

    <script>
        // Chart.js Setup
        const ctx = document.getElementById('iotChart').getContext('2d');
        
        let gradientFill = ctx.createLinearGradient(0, 0, 0, 600);
        gradientFill.addColorStop(0, 'rgba(0, 240, 255, 0.4)');
        gradientFill.addColorStop(1, 'rgba(0, 240, 255, 0.0)');

        const iotChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Sonde A1 (°C)',
                    data: [],
                    borderColor: '#00f0ff',
                    borderWidth: 2,
                    backgroundColor: gradientFill,
                    fill: true,
                    tension: 0.1,
                    pointRadius: 2,
                    pointBackgroundColor: '#fff',
                    pointBorderColor: '#00f0ff',
                    pointHoverRadius: 8,
                    pointHoverBackgroundColor: '#00f0ff',
                    pointHoverBorderColor: '#fff'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 0 },
                plugins: { legend: { display: false } },
                scales: {
                    y: {
                        grid: { color: 'rgba(0, 240, 255, 0.1)', borderDash: [5, 5] },
                        ticks: { color: '#64748b', font: { family: 'Space Grotesk' } },
                        min: 10, max: 100
                    },
                    x: {
                        grid: { color: 'rgba(0, 240, 255, 0.05)' },
                        ticks: { color: '#64748b', font: { family: 'Space Grotesk' }, maxTicksLimit: 8 }
                    }
                }
            }
        });

        // WebSocket Setup
        const clientId = Math.random().toString(36).substring(7);
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws/stream/${clientId}`;
        
        const ws = new WebSocket(wsUrl);
        const statusEl = document.getElementById('conn-status');
        const tempEl = document.getElementById('current-temp');
        const terminal = document.getElementById('terminal-logs');

        ws.onopen = () => {
            statusEl.innerHTML = '<i class="ph ph-plugs-connected text-lg"></i> LIAISON SÉCURISÉE';
            statusEl.style.borderColor = '#00f0ff';
            statusEl.style.color = '#00f0ff';
            statusEl.style.boxShadow = 'inset 0 0 15px rgba(0, 240, 255, 0.4), 0 0 15px rgba(0, 240, 255, 0.2)';
        };

        ws.onclose = () => {
            statusEl.innerHTML = '<i class="ph ph-warning-circle text-lg"></i> LIAISON PERDUE';
            statusEl.style.borderColor = '#ff003c';
            statusEl.style.color = '#ff003c';
            statusEl.style.boxShadow = 'inset 0 0 15px rgba(255, 0, 60, 0.4), 0 0 15px rgba(255, 0, 60, 0.2)';
            document.querySelector('.live-dot').style.animation = 'none';
            document.querySelector('.live-dot').style.background = '#333';
        };

        const maxPoints = 50;

        ws.onmessage = (event) => {
            const payload = JSON.parse(event.data);
            const value = payload.value;
            const timeLabel = new Date().toLocaleTimeString('fr-FR', {second:'2-digit', minute:'2-digit', hour:'2-digit'});
            
            // UI Update
            tempEl.innerHTML = `${value.toFixed(1)}<span class="text-3xl text-slate-500">°C</span>`;
            tempEl.classList.add('flash');
            setTimeout(() => tempEl.classList.remove('flash'), 100);

            // Chart Update
            iotChart.data.labels.push(timeLabel);
            iotChart.data.datasets[0].data.push(value);
            if (iotChart.data.labels.length > maxPoints) {
                iotChart.data.labels.shift();
                iotChart.data.datasets[0].data.shift();
            }
            iotChart.update();

            // Terminal
            const logEntry = document.createElement('div');
            logEntry.className = 'mb-1';
            logEntry.innerHTML = `<span class="text-[#00f0ff] mr-2">[${timeLabel}]</span><span class="text-white">RECV: ${JSON.stringify(payload)}</span>`;
            terminal.appendChild(logEntry);
            
            if (terminal.childElementCount > 50) terminal.removeChild(terminal.firstChild);
            terminal.scrollTop = terminal.scrollHeight;
        };
    </script>
</body>
</html>
